name: Build mods (Fabric 1.21.1)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Unpack sources zip
        run: |
          set -e
          ZIP=$(ls -1 *.zip 2>/dev/null | head -n1 || true)
          if [ -z "$ZIP" ]; then echo "No .zip with sources in the repository root"; exit 1; fi
          echo "Using $ZIP"
          rm -rf work && mkdir work
          unzip -q -o "$ZIP" -d work
          # find project directories (they contain settings.gradle)
          find work -maxdepth 3 -name settings.gradle -printf '%h\n' | sort > projects.txt
          echo "Projects:"; cat projects.txt

      - name: Pick latest Fabric API for 1.21.1
        run: |
          set -e
          curl -fsSL https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml -o meta.xml
          VER=$(grep -o '<version>[^<]*+1\.21\.1</version>' meta.xml | sed 's/<[^>]*>//g' | tail -n1)
          echo "Fabric API: $VER"
          while read -r d; do
            sed -i "s|^fabric_version=.*|fabric_version=$VER|" "$d/gradle.properties"
          done < projects.txt

      - name: Build all projects
        run: |
          mkdir -p jars logs
          FAIL=0
          while read -r d; do
            name=$(basename "$d")
            echo "=== Building $name ==="
            if (cd "$d" && gradle build --no-daemon --stacktrace > "$GITHUB_WORKSPACE/logs/$name.log" 2>&1); then
              echo "$name OK"
              find "$d/build/libs" -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} jars/ \;
            else
              echo "$name FAILED (see logs artifact)"
              grep -E "error:" -A2 "$GITHUB_WORKSPACE/logs/$name.log" | head -400 || true
              FAIL=1
            fi
          done < projects.txt
          echo "FAIL=$FAIL" >> "$GITHUB_ENV"

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: mods-jars
          path: jars/*.jar
          if-no-files-found: warn

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/*.log

      - name: Fail if any project failed
        if: env.FAIL == '1'
        run: exit 1
